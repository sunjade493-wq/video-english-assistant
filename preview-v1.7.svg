    <text x="1128" y="243" fill="#6b7685" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800">生词：</text><text x="1185" y="243" fill="#2b3542" font-family="Inter, Arial, sans-serif" font-size="16">lecture</text>
    <rect x="1112" y="266" width="336" height="38" rx="14" fill="#f7f9fc" stroke="#e7edf6"/>
