    <rect x="1112" y="312" width="336" height="38" rx="14" fill="#f7f9fc" stroke="#e7edf6"/>
    <text x="1128" y="335" fill="#6b7685" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800">中文释义：</text><text x="1210" y="335" fill="#2b3542" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="16">讲座；授课</text>
