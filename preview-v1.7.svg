    <rect x="1112" y="434" width="58" height="27" rx="13" fill="#e0ecff"/>
    <text x="1123" y="453" fill="#1d4ed8" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="800">[理解]</text>
    <rect x="1112" y="482" width="336" height="70" rx="14" fill="#f7f9fc" stroke="#e7edf6"/>
    <text x="1128" y="506" fill="#6b7685" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800">出处：</text>
    <text x="1128" y="532" fill="#2b3542" font-family="Inter, Arial, sans-serif" font-size="15">If you enjoyed this lecture, I'm sure...</text>
    <rect x="1112" y="562" width="336" height="42" rx="14" fill="#f7f9fc" stroke="#e7edf6"/>
    <text x="1128" y="588" fill="#6b7685" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800">字面意思：</text><text x="1210" y="588" fill="#2b3542" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="15">把它放到我们身上</text>
    <rect x="1112" y="614" width="336" height="58" rx="14" fill="#f7f9fc" stroke="#e7edf6"/>
    <text x="1128" y="640" fill="#6b7685" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800">实际意思：</text><text x="1210" y="640" fill="#2b3542" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="15">直接告诉我们；别拐弯抹角。</text>
    <rect x="1112" y="682" width="336" height="90" rx="14" fill="#f7f9fc" stroke="#e7edf6"/>
    <text x="1128" y="707" fill="#6b7685" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800">语法解释：</text>
    <text x="1128" y="733" fill="#2b3542" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="15">lay it on someone 是口语表达，</text>
    <text x="1128" y="755" fill="#2b3542" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="15">to lay it on us 是不定式短语。</text>
    <rect x="1112" y="786" width="336" height="44" rx="22" fill="#16a34a"/>
    <text x="1218" y="814" fill="#ffffff" font-family="Inter, Arial, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="750">✓ 不用管我了</text>
