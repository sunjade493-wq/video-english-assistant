<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef4ff" offset="0"/>
      <stop stop-color="#f4f7fb" offset="0.5"/>
      <stop stop-color="#f8fbff" offset="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="0.05" r="0.65">
      <stop stop-color="#d9e7ff" stop-opacity="0.95" offset="0"/>
      <stop stop-color="#d9e7ff" stop-opacity="0" offset="1"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1b2430" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1520" height="900" fill="url(#bg)"/>
  <rect width="1520" height="900" fill="url(#glow)"/>

