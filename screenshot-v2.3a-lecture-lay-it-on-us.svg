  <text x="436" y="385" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">If you enjoyed this lecture, I&#x27;m sure you&#x27;re too busy to lay it on us.</text>
  <text x="436" y="426" text-anchor="middle" font-size="22" fill="#f4d479">如果你喜欢这堂讲座，我相信你也很忙，但请直接告诉我们。</text>
