<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video English Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="video-panel" aria-label="视频学习区">
      <div class="video-frame">
        <div class="video-placeholder">
          <span class="play-icon" aria-hidden="true" id="playIcon">▶</span>
          <div>
            <h1>Video English Assistant</h1>
            <p id="videoStatusText">V2.3 Obstacle Subtitle Marker · Playing</p>
          </div>
        </div>
        <div class="learning-pause-hint" id="learningPauseHint" aria-live="polite" hidden>
          <div class="learning-pause-hint__text">
            <strong>点击视频继续播放</strong>
            <span>或</span>
            <span>✓ 不用管我了</span>
          </div>
          <button class="learning-pause-hint__button" id="learningPauseHintDismiss" type="button">知道了</button>
        </div>
        <div class="subtitle-overlay" aria-live="polite">
          <p class="subtitle-line" id="currentSubtitleLine"></p>
        </div>
      </div>
      <div class="video-meta">
        <p class="eyebrow">Today's Lecture</p>
        <h2>Academic Listening Practice</h2>
        <p>在左侧观看视频，右侧按照出现顺序追踪生词与理解障碍。</p>
      </div>

      <section class="subtitle-input-panel" aria-labelledby="subtitleInputTitle">
        <div class="subtitle-input-header">
          <div>
            <p class="eyebrow">Subtitle Input</p>
            <h2 id="subtitleInputTitle">Subtitle Input</h2>
          </div>
          <button class="analyze-button" id="analyzeButton" type="button">Analyze</button>
        </div>
        <label class="sr-only" for="subtitleTextInput">英文字幕文本</label>
        <textarea id="subtitleTextInput" class="subtitle-textarea" rows="8">If you enjoyed this lecture,
I'm sure you're too busy to lay it on us.

Can you give me a hand?

I was pulled off the project.

Let's call it a day.</textarea>
      </section>
    </section>

    <aside class="obstacle-panel" aria-label="提示">
      <header class="stream-header">
        <div>
          <p class="eyebrow">Learning Tips</p>
          <h2>提示</h2>
        </div>
        <div class="learning-mode-controls" aria-label="Learning Tips Mode">
          <span class="learning-mode-label">Learning Tips Mode:</span>
          <div class="learning-mode-toggle" role="group" aria-label="Learning Tips Mode">
            <button class="learning-mode-button" id="autoSyncModeButton" type="button" data-learning-mode="auto">Auto Sync</button>
            <button class="learning-mode-button is-active" id="clickToLearnModeButton" type="button" data-learning-mode="click" aria-pressed="true">Click to Learn</button>
          </div>
        </div>
        <button class="restore-button" id="restoreAllButton" type="button">恢复全部</button>
      </header>

      <div class="card-stream" id="cardStream" aria-live="polite"></div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
