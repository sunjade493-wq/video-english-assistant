<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video English Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="video-panel" aria-label="视频学习区">
      <div class="video-frame">
        <div class="video-placeholder">
          <span class="play-icon" aria-hidden="true" id="playIcon">▶</span>
          <div>
            <h1>Video English Assistant</h1>
            <p id="videoStatusText">V2.3A Current Subtitle Learning Tips · Playing</p>
          </div>
        </div>
        <div class="learning-pause-hint" id="learningPauseHint" aria-live="polite" hidden>
          <div class="learning-pause-hint__text">
            <strong>点击视频继续播放</strong>
            <span>或</span>
            <span>✓ 不用管我了</span>
          </div>
          <button class="learning-pause-hint__button" id="learningPauseHintDismiss" type="button">知道了</button>
        </div>
        <div class="subtitle-overlay" aria-live="polite">
          <p class="subtitle-line" id="currentSubtitleLine"></p>
        </div>
      </div>
      <section class="player-footer" aria-label="播放器控制区">
        <div class="player-footer__row player-footer__row--meta">
          <span class="timeline-time" id="timelineTimeText">00:00 / 00:14</span>
          <div class="footer-menu footer-menu--level" aria-labelledby="levelMenuTitle">
            <span class="eyebrow sr-only" id="levelMenuTitle">Vocabulary Level</span>
            <button class="footer-menu__button" id="levelMenuButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="levelMenu">Level <span aria-hidden="true">▼</span></button>
            <div class="footer-menu__popup footer-menu__popup--light level-menu" id="levelMenu" role="menu" aria-labelledby="levelMenuButton">
              <button class="footer-menu__item is-selected" type="button" role="menuitemradio" aria-checked="true" data-vocabulary-level="junior">Junior High (1500)</button>
              <button class="footer-menu__item" type="button" role="menuitemradio" aria-checked="false" data-vocabulary-level="senior">Senior High (3500)</button>
              <button class="footer-menu__item" type="button" role="menuitemradio" aria-checked="false" data-vocabulary-level="cet4">CET-4 (4500)</button>
              <button class="footer-menu__item" type="button" role="menuitemradio" aria-checked="false" data-vocabulary-level="cet6">CET-6 (6000)</button>
              <button class="footer-menu__item" type="button" role="menuitemradio" aria-checked="false" data-vocabulary-level="tem4">TEM-4 (8000)</button>
              <button class="footer-menu__item" type="button" role="menuitemradio" aria-checked="false" data-vocabulary-level="tem8">TEM-8 (12000)</button>
              <button class="footer-menu__item" type="button" role="menuitemradio" aria-checked="false" data-vocabulary-level="gre">GRE (20000+)</button>
            </div>
          </div>
          <div class="footer-menu footer-menu--episodes" aria-labelledby="episodeLabel">
            <span class="eyebrow sr-only" id="episodeLabel">Episode</span>
            <button class="footer-menu__button" id="episodeMenuButton" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="episodeMenu">Episodes <span aria-hidden="true">▼</span></button>
            <div class="footer-menu__popup episode-menu" id="episodeMenu" role="dialog" aria-labelledby="episodeMenuButton">
              <div class="episode-menu__header">第12季 · 共24集</div>
              <div class="episode-menu__grid" aria-label="Episodes 1 through 24">
                <button class="episode-menu__item is-current" type="button"><span class="episode-menu__play" aria-hidden="true">▶</span>1</button>
                <button class="episode-menu__item" type="button">2</button>
                <button class="episode-menu__item" type="button">3</button>
                <button class="episode-menu__item" type="button">4</button>
                <button class="episode-menu__item" type="button">5 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">6 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">7 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">8 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">9 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">10 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">11 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">12 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">13 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">14 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">15 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">16 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">17 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">18 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">19 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">20 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">21 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">22 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">23 <span class="episode-menu__badge">会员</span></button>
                <button class="episode-menu__item" type="button">24 <span class="episode-menu__badge">会员</span></button>
              </div>
            </div>
          </div>
          <div class="footer-menu footer-menu--speed" aria-labelledby="playbackSpeedTitle">
            <span class="eyebrow sr-only" id="playbackSpeedTitle">Playback Speed</span>
            <button class="footer-menu__button" id="speedMenuButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="speedMenu">Speed <span aria-hidden="true">▼</span></button>
            <div class="footer-menu__popup footer-menu__popup--light speed-menu" id="speedMenu" role="menu" aria-labelledby="speedMenuButton">
              <button class="footer-menu__item playback-speed-button" type="button" role="menuitemradio" aria-checked="false" data-playback-rate="0.5">0.5x</button>
              <button class="footer-menu__item playback-speed-button" type="button" role="menuitemradio" aria-checked="false" data-playback-rate="0.75">0.75x</button>
              <button class="footer-menu__item playback-speed-button is-selected" type="button" role="menuitemradio" aria-checked="true" data-playback-rate="1">1.0x</button>
              <button class="footer-menu__item playback-speed-button" type="button" role="menuitemradio" aria-checked="false" data-playback-rate="1.25">1.25x</button>
              <button class="footer-menu__item playback-speed-button" type="button" role="menuitemradio" aria-checked="false" data-playback-rate="1.5">1.5x</button>
              <button class="footer-menu__item playback-speed-button" type="button" role="menuitemradio" aria-checked="false" data-playback-rate="1.75">1.75x</button>
              <button class="footer-menu__item playback-speed-button" type="button" role="menuitemradio" aria-checked="false" data-playback-rate="2">2.0x</button>
            </div>
          </div>
        </div>
        <div class="player-footer__row player-footer__row--timeline">
          <button class="timeline-play-button" id="timelinePlayButton" type="button" aria-label="暂停视频">▶（播放）</button>
          <input class="video-timeline" id="videoTimeline" type="range" min="0" max="100" value="0" step="0.1" aria-label="视频时间轴">
        </div>
        <div class="player-footer__row player-footer__row--heat">
          <span class="heat-axis-label">〇（障碍）</span>
          <div class="obstacle-heat-axis" id="obstacleHeatAxis" aria-label="障碍"></div>
        </div>
      </section>

    </section>

    <aside class="obstacle-panel" aria-label="障碍卡片">
      <section class="episode-progress-summary" aria-labelledby="episodeProgressTitle">
        <h3 id="episodeProgressTitle">本集障碍</h3>
        <div class="episode-progress-summary__status-row">
          <p class="episode-progress-summary__item episode-progress-summary__item--conquered">✓ 已攻克<span id="conqueredObstacleCount">0</span></p>
          <span class="episode-progress-summary__separator" aria-hidden="true">·</span>
          <p class="episode-progress-summary__item">○ 剩余<span id="remainingObstacleCount">0</span></p>
          <span class="episode-progress-summary__separator" aria-hidden="true">·</span>
          <button class="undo-button episode-progress-summary__undo" id="episodeUndoButton" type="button">↩ 返回上一个障碍</button>
        </div>
      </section>

      <div class="card-stream" id="cardStream" aria-live="polite"></div>
    </aside>
  </main>

  <div class="bottom-sheet-backdrop" id="bottomSheetBackdrop" hidden></div>
  <section class="bottom-sheet" id="obstacleBottomSheet" aria-labelledby="bottomSheetTitle" aria-modal="true" role="dialog" hidden>
    <div class="bottom-sheet__handle" aria-hidden="true"></div>
    <header class="bottom-sheet__header">
      <div>
        <p class="eyebrow">Obstacle Navigation</p>
        <h2 id="bottomSheetTitle">当前区域障碍（0）</h2>
      </div>
      <button class="bottom-sheet__close" id="bottomSheetClose" type="button" aria-label="关闭障碍导航">×</button>
    </header>
    <div class="bottom-sheet__content" id="bottomSheetContent"></div>
  </section>

  <script src="analyze-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
