<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video English Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="video-panel" aria-label="视频学习区">
      <div class="video-frame">
        <div class="video-placeholder">
          <span class="play-icon" aria-hidden="true">▶</span>
          <div>
            <h1>Video English Assistant</h1>
            <p>V2.0 Learning Flow Frozen</p>
          </div>
        </div>
      </div>
      <div class="video-meta">
        <p class="eyebrow">Today's Lecture</p>
        <h2>Academic Listening Practice</h2>
        <p>在左侧观看视频，右侧按照出现顺序追踪生词与理解障碍。</p>
      </div>

      <section class="subtitle-input-panel" aria-labelledby="subtitleInputTitle">
        <div class="subtitle-input-header">
          <div>
            <p class="eyebrow">Subtitle Input</p>
            <h2 id="subtitleInputTitle">Subtitle Input</h2>
          </div>
          <button class="analyze-button" id="analyzeButton" type="button">Analyze</button>
        </div>
        <label class="sr-only" for="subtitleTextInput">英文字幕文本</label>
        <textarea id="subtitleTextInput" class="subtitle-textarea" rows="4">If you enjoyed this lecture, I'm sure you're too busy to lay it on us.</textarea>
      </section>
    </section>

    <aside class="obstacle-panel" aria-label="障碍流">
      <header class="stream-header">
        <div>
          <p class="eyebrow">Obstacle Stream</p>
          <h2>障碍流</h2>
        </div>
      </header>

      <div class="card-stream" id="cardStream" aria-live="polite"></div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
