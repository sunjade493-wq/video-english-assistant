<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video English Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="video-panel" aria-label="视频学习区">
      <div class="video-frame">
        <div class="video-placeholder">
          <span class="play-icon" aria-hidden="true" id="playIcon">▶</span>
          <div>
            <h1>Video English Assistant</h1>
            <p id="videoStatusText">V2.3A Current Subtitle Learning Tips · Playing</p>
          </div>
        </div>
        <div class="learning-pause-hint" id="learningPauseHint" aria-live="polite" hidden>
          <div class="learning-pause-hint__text">
            <strong>点击视频继续播放</strong>
            <span>或</span>
            <span>✓ 不用管我了</span>
          </div>
          <button class="learning-pause-hint__button" id="learningPauseHintDismiss" type="button">知道了</button>
        </div>
        <div class="subtitle-overlay" aria-live="polite">
          <p class="subtitle-line" id="currentSubtitleLine"></p>
        </div>
      </div>
      <section class="player-footer" aria-label="播放器控制区">
        <div class="player-footer__row player-footer__row--meta">
          <span class="timeline-time" id="timelineTimeText">00:00 / 00:14</span>
          <div class="footer-menu level-card" aria-labelledby="levelLabel">
            <span class="eyebrow sr-only" id="levelLabel">Level</span>
            <button class="footer-menu__button" id="levelMenuButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="levelMenu">Level <span aria-hidden="true">▼</span></button>
            <div class="footer-menu__popup footer-menu__popup--level" id="levelMenu" role="listbox" aria-labelledby="levelLabel" hidden>
              <button class="footer-menu__option" type="button" role="option" aria-selected="true">初中</button>
              <button class="footer-menu__option" type="button" role="option">高中</button>
              <button class="footer-menu__option" type="button" role="option">CET4</button>
              <button class="footer-menu__option" type="button" role="option">CET6</button>
              <button class="footer-menu__option" type="button" role="option">考研</button>
              <button class="footer-menu__option" type="button" role="option">托福</button>
              <button class="footer-menu__option" type="button" role="option">自定义</button>
            </div>
          </div>
          <div class="footer-menu episode-card" aria-labelledby="episodeLabel">
            <span class="eyebrow sr-only" id="episodeLabel">Episode</span>
            <button class="footer-menu__button" id="episodeMenuButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="episodeMenu">Episodes <span aria-hidden="true">▼</span></button>
            <div class="footer-menu__popup footer-menu__popup--episodes" id="episodeMenu" role="listbox" aria-labelledby="episodeMenuTitle" hidden>
              <p class="episode-menu__title" id="episodeMenuTitle">第12季 · 共24集</p>
              <div class="episode-menu__grid">
                <button class="episode-menu__item is-current" type="button" role="option" aria-selected="true">1</button>
                <button class="episode-menu__item" type="button" role="option">2 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">3 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">4 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">5 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">6 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">7 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">8 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">9 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">10 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">11 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">12 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">13 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">14 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">15 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">16 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">17 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">18 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">19 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">20 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">21 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">22 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">23 <span class="episode-menu__member-badge">会员</span></button>
                <button class="episode-menu__item" type="button" role="option">24 <span class="episode-menu__member-badge">会员</span></button>
              </div>
            </div>
          </div>
          <div class="footer-menu playback-speed-card" aria-labelledby="playbackSpeedTitle">
            <span class="eyebrow sr-only" id="playbackSpeedTitle">Playback Speed</span>
            <button class="footer-menu__button" id="speedMenuButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="speedMenu">Speed <span aria-hidden="true">▼</span></button>
            <div class="footer-menu__popup footer-menu__popup--speed" id="speedMenu" role="listbox" aria-labelledby="playbackSpeedTitle" hidden>
              <button class="footer-menu__option playback-speed-button" type="button" role="option" data-playback-rate="0.5">0.5x</button>
              <button class="footer-menu__option playback-speed-button" type="button" role="option" data-playback-rate="0.75">0.75x</button>
              <button class="footer-menu__option playback-speed-button" type="button" role="option" data-playback-rate="1">1.0x</button>
              <button class="footer-menu__option playback-speed-button" type="button" role="option" data-playback-rate="1.25">1.25x</button>
              <button class="footer-menu__option playback-speed-button" type="button" role="option" data-playback-rate="1.5">1.5x</button>
              <button class="footer-menu__option playback-speed-button" type="button" role="option" data-playback-rate="2">2.0x</button>
            </div>
          </div>
        </div>
        <div class="player-footer__row player-footer__row--timeline">
          <button class="timeline-play-button" id="timelinePlayButton" type="button" aria-label="暂停视频">▶（播放）</button>
          <input class="video-timeline" id="videoTimeline" type="range" min="0" max="100" value="0" step="0.1" aria-label="视频时间轴">
        </div>
        <div class="player-footer__row player-footer__row--heat">
          <span class="heat-axis-label">〇（障碍）</span>
          <div class="obstacle-heat-axis" id="obstacleHeatAxis" aria-label="障碍"></div>
        </div>
      </section>

    </section>

    <aside class="obstacle-panel" aria-label="障碍卡片">
      <section class="episode-progress-summary" aria-labelledby="episodeProgressTitle">
        <h3 id="episodeProgressTitle">本集障碍</h3>
        <div class="episode-progress-summary__status-row">
          <p class="episode-progress-summary__item episode-progress-summary__item--conquered">✓ 已攻克<span id="conqueredObstacleCount">0</span></p>
          <span class="episode-progress-summary__separator" aria-hidden="true">·</span>
          <p class="episode-progress-summary__item">○ 剩余<span id="remainingObstacleCount">0</span></p>
          <span class="episode-progress-summary__separator" aria-hidden="true">·</span>
          <button class="undo-button episode-progress-summary__undo" id="episodeUndoButton" type="button">↩ 返回上一个障碍</button>
        </div>
      </section>

      <div class="card-stream" id="cardStream" aria-live="polite"></div>
    </aside>
  </main>

  <div class="bottom-sheet-backdrop" id="bottomSheetBackdrop" hidden></div>
  <section class="bottom-sheet" id="obstacleBottomSheet" aria-labelledby="bottomSheetTitle" aria-modal="true" role="dialog" hidden>
    <div class="bottom-sheet__handle" aria-hidden="true"></div>
    <header class="bottom-sheet__header">
      <div>
        <p class="eyebrow">Obstacle Navigation</p>
        <h2 id="bottomSheetTitle">当前区域障碍（0）</h2>
      </div>
      <button class="bottom-sheet__close" id="bottomSheetClose" type="button" aria-label="关闭障碍导航">×</button>
    </header>
    <div class="bottom-sheet__content" id="bottomSheetContent"></div>
  </section>

  <script src="analyze-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
